<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d95443" />
      <stop offset="100%" stop-color="#ab2c1f" />
    </linearGradient>
  </defs>
  <!-- Main Seal Block -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#sealGrad)" />
  
  <!-- Subtle inner border for seal effect -->
  <rect x="56" y="56" width="400" height="400" rx="76" ry="76" stroke="#fcfaf2" stroke-width="12" fill="none" opacity="0.3" stroke-dasharray="80 20 40 10 90 30" />

  <!-- The "文" (Literature/Writing) character -->
  <g stroke="#fcfaf2" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Dot -->
    <line x1="256" y1="130" x2="256" y2="180" />
    <!-- Horizontal Line -->
    <line x1="140" y1="240" x2="372" y2="240" />
    <!-- Left Curve (Pie) -->
    <path d="M256 240 C256 340, 180 390, 130 410" />
    <!-- Right Curve (Na) -->
    <path d="M256 280 C310 350, 360 390, 400 410" />
  </g>
</svg>
